# Tests for the shared workflows themselves; not meant to be called from other repositories.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same builder image.yml runs on, for tests/image.sh.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run tests/*.sh
        run: |
          status=0
          for t in tests/*.sh; do
            [ "$t" = tests/lib.sh ] && continue
            echo "::group::$t"
            "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
