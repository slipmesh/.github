# Tests for the shared workflows themselves; not meant to be called from other repositories.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=crate depName=zizmor
  ZIZMOR_VERSION: 1.32.0

jobs:
  # Security audit of the workflows: injection through inputs, credentials left in a checkout,
  # permissions broader than a job needs.
  zizmor:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: zizmor@${{ env.ZIZMOR_VERSION }}

      - run: zizmor --offline --config .github/zizmor.yml .github/workflows

  tests:
    runs-on: ubuntu-26.04
    # tests/image.sh pushes to it the way image.yml pushes to ghcr.io.
    services:
      registry:
        image: registry:3
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same builder image.yml runs on, for tests/image.sh; host networking lets it reach the
      # job's registry on localhost.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Run tests/*.sh
        env:
          TEST_REGISTRY: localhost:5000
        run: |
          status=0
          for t in tests/*.sh; do
            [ "$t" = tests/lib.sh ] && continue
            echo "::group::$t"
            "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
