# Tests for the shared workflows themselves; not meant to be called from other repositories.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Run tests/*.sh
        run: |
          status=0
          for t in tests/*.sh; do
            [ "$t" = tests/lib.sh ] && continue
            echo "::group::$t"
            "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
