# Tests for the shared workflows themselves; not meant to be called from other repositories.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-26.04
    # tests/image.sh pushes to it the way image.yml pushes to ghcr.io.
    services:
      registry:
        image: registry:3
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same builder image.yml runs on, for tests/image.sh; host networking lets it reach the
      # job's registry on localhost.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      # tests/renovate.sh runs Renovate itself, which needs a newer Node than the runner's.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run tests/*.sh
        env:
          TEST_REGISTRY: localhost:5000
          # Renovate's tag lookups on github.com are rate-limited without one.
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: |
          status=0
          for t in tests/*.sh; do
            [ "$t" = tests/lib.sh ] && continue
            echo "::group::$t"
            "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
