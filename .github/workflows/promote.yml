# A release tag rebuilds nothing: it retags the `sha-<commit>` image that image.yml published, so
# what ships is what was tested. This is the only shared workflow that writes packages.
name: Promote

on:
  workflow_call:
    inputs:
      image:
        description: Image repository; defaults to ghcr.io/<owner>/<repo>.
        type: string
        default: ""
      latest:
        description: Also tag the promoted image `latest`. Leave off for anything released per Talos line.
        type: boolean
        default: false
    outputs:
      image-ref:
        description: The promoted image by digest, for release.yml.
        value: ${{ jobs.promote.outputs.image-ref }}

permissions:
  contents: read

env:
  IMAGE: ${{ inputs.image || format('ghcr.io/{0}', github.repository) }}

jobs:
  promote:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.retag.outputs.image-ref }}
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag usually arrives while the commit's own run is still building its image, so wait
      # for it rather than fail on the race. The tag is resolved to a digest once and everything
      # after uses that digest, so a `sha-<commit>` rewritten mid-run cannot ship.
      - name: Retag the tagged commit's image as the release
        id: retag
        env:
          LATEST: ${{ inputs.latest }}
        run: |
          source="$IMAGE:sha-$GITHUB_SHA"
          for _ in $(seq 60); do
            docker buildx imagetools inspect "$source" >/dev/null 2>&1 && break
            sleep 30
          done
          docker buildx imagetools inspect "$source" >/dev/null || {
            echo "::error::$source does not exist - $GITHUB_REF_NAME must tag a commit that was built on main or a release-* branch"
            exit 1
          }
          digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -r .digest)
          tags=(-t "$IMAGE:${GITHUB_REF_NAME//+/-}")
          [ "$LATEST" = true ] && tags+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$digest"
          echo "image-ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
