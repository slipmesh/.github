# A release tag rebuilds nothing: it retags the `sha-<commit>` image that the caller's CI
# published, so what ships is what was tested. This is the only shared workflow that writes packages.
name: Promote

on:
  workflow_call:
    inputs:
      image:
        description: Image repository; defaults to ghcr.io/<owner>/<repo>.
        type: string
        default: ""
      latest:
        description: Also tag the promoted image `latest`. Leave off for anything released per Talos line.
        type: boolean
        default: false
      tag:
        description: Release tag; defaults to the tag that triggered the run.
        type: string
        default: ""
    outputs:
      image-ref:
        description: The promoted image by digest, for release.yml.
        value: ${{ jobs.promote.outputs.image-ref }}

permissions:
  contents: read

env:
  IMAGE: ${{ inputs.image || format('ghcr.io/{0}', github.repository) }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  promote:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.retag.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A commit that changes only Markdown, such as a release commit, is not built: it releases the
      # image of the nearest ancestor with one, if nothing but Markdown changed since. The tag
      # usually arrives while that commit's own run is still building its image, so wait for it
      # rather than fail on the race.
      - name: Find the commit whose image the tag releases
        id: source
        run: |
          commit=$GITHUB_SHA
          while ! docker buildx imagetools inspect "$IMAGE:sha-$commit" >/dev/null 2>&1; do
            parent=$(git rev-parse -q --verify "$commit^") || break
            git diff --quiet "$parent" "$commit" -- ':!*.md' || break
            commit=$parent
          done
          for _ in $(seq 60); do
            docker buildx imagetools inspect "$IMAGE:sha-$commit" >/dev/null 2>&1 && break
            sleep 30
          done
          docker buildx imagetools inspect "$IMAGE:sha-$commit" >/dev/null || {
            echo "::error::$IMAGE:sha-$commit does not exist - $RELEASE_TAG must tag a commit built on main or a release-* branch, or one that changes only Markdown on top of it"
            exit 1
          }
          [ "$commit" = "$GITHUB_SHA" ] || echo "$GITHUB_SHA changes only Markdown since $commit, releasing its image"
          echo "source=$commit" >> "$GITHUB_OUTPUT"

      # The image is resolved to a digest once and everything after uses that digest, so a
      # `sha-<commit>` rewritten mid-run cannot ship.
      - name: Retag the image as the release
        id: retag
        env:
          LATEST: ${{ inputs.latest }}
          SOURCE: ${{ steps.source.outputs.source }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$SOURCE" --format '{{json .Manifest}}' | jq -r .digest)
          tags=(-t "$IMAGE:${RELEASE_TAG//+/-}")
          [ "$LATEST" = true ] && tags+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$digest"
          echo "image-ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
