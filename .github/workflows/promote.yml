# Retags the `sha-<commit>` image the caller's run has just built as the release, by digest, so the
# release is that build and nothing else.
name: Promote

on:
  workflow_call:
    inputs:
      image:
        description: Image repository; defaults to ghcr.io/<owner>/<repo>.
        type: string
        default: ""
      latest:
        description: Also tag the image `latest`. Never for a pre-release or anything released per Talos line.
        type: boolean
        default: false
      tag:
        description: The release tag; `+` becomes `-`, which OCI tags cannot hold.
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE: ${{ inputs.image || format('ghcr.io/{0}', github.repository) }}
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  promote:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag the image as the release
        env:
          LATEST: ${{ inputs.latest }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          tags=(-t "$IMAGE:${RELEASE_TAG//+/-}")
          [ "$LATEST" = true ] && tags+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$digest"
