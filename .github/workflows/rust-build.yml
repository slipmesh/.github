# The release binaries, built in the run that releases them, on each arch's own runner for the
# musl target. They are uploaded as `binaries-<arch>`, a tar of `<arch>/release/<name>`, the
# `target/${TARGETARCH}/release/<name>` path image.yml's Dockerfile copies from, together with the
# notices of everything linked into them, which the image and the GitHub Release carry:
# THIRD-PARTY-NOTICES for the crates, COPYRIGHT-rust-std.html for the standard library and
# COPYRIGHT-musl for the C library.
name: Rust build

on:
  workflow_call:
    inputs:
      binaries:
        description: Space-separated binary names to upload from each arch's release build.
        type: string
        required: true
      build-args:
        description: Extra `cargo build --release` arguments, such as `-p name` to build part of a workspace.
        type: string
        default: ""

permissions:
  contents: read

env:
  # renovate: datasource=crate depName=cargo-about
  CARGO_ABOUT_VERSION: 0.9.3

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - arch: arm64
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.rust_target }}

      - name: build
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          read -ra args <<<"$BUILD_ARGS"
          cargo build --release --locked --target ${{ matrix.rust_target }} "${args[@]}"

      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      # Licenses such as BSD-3-Clause and MIT hold only if their notices travel with the binary.
      # The caller's about.toml lists the accepted licenses and about.hbs renders them; --fail
      # refuses a crate whose license cannot be determined. The crates' notices cover both arches,
      # NOTICE_TARGETS being the matrix's targets, so every copy is the same file. Rust links its
      # own musl libc.a and ships no notice for it; the musl package's copyright is that of the
      # same project, under the same license.
      - name: Third-party notices
        id: notices
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          NOTICE_TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          MUSL_COPYRIGHT: /usr/share/doc/musl/copyright
        run: |
          out=target/$RUST_TARGET/release
          read -ra targets <<<"$NOTICE_TARGETS"
          cargo about generate --locked --workspace --fail "${targets[@]/#/--target=}" \
            -o "$out/THIRD-PARTY-NOTICES" about.hbs
          cp "$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html" "$out/COPYRIGHT-rust-std.html"
          cp "$MUSL_COPYRIGHT" "$out/COPYRIGHT-musl"

      # The artifact store drops file modes, so the staged tree travels as one tar that keeps them.
      - name: Stage binaries and notices at their TARGETARCH path
        id: stage
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
          BINARIES: ${{ inputs.binaries }}
        run: |
          read -ra names <<<"$BINARIES"
          dir=staged/$ARCH/release
          mkdir -p "$dir"
          for name in "${names[@]}"; do
            install -m 0755 "target/$RUST_TARGET/release/$name" "$dir/"
          done
          for notice in THIRD-PARTY-NOTICES COPYRIGHT-rust-std.html COPYRIGHT-musl; do
            install -m 0644 "target/$RUST_TARGET/release/$notice" "$dir/"
          done
          tar -C staged -cf "staged/binaries-$ARCH.tar" "$ARCH"
          rm -r "staged/$ARCH"

      # "Re-run failed jobs" reuses this run's artifacts instead of building again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.arch }}
          path: staged/binaries-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 14
