# The release binaries, built in the run that releases them, on each arch's own runner for the
# musl target. They are uploaded as `binaries-<arch>` at `<arch>/release/<name>`, the
# `target/${TARGETARCH}/release/<name>` path image.yml's Dockerfile copies from.
name: Rust build

on:
  workflow_call:
    inputs:
      binaries:
        description: Space-separated binary names to upload from each arch's release build.
        type: string
        required: true
      build-args:
        description: Extra `cargo build --release` arguments, such as `-p name` to build part of a workspace.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - arch: arm64
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.rust_target }}

      - name: build
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          read -ra args <<<"$BUILD_ARGS"
          cargo build --release --target ${{ matrix.rust_target }} "${args[@]}"

      - name: Stage binaries at their TARGETARCH path
        env:
          BINARIES: ${{ inputs.binaries }}
        run: |
          read -ra names <<<"$BINARIES"
          mkdir -p "staged/${{ matrix.arch }}/release"
          for name in "${names[@]}"; do
            cp "target/${{ matrix.rust_target }}/release/$name" "staged/${{ matrix.arch }}/release/"
          done

      # "Re-run failed jobs" reuses this run's artifacts instead of building again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.arch }}
          path: staged/
          if-no-files-found: error
          retention-days: 14
