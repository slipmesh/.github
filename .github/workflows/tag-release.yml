# Tags a release commit after the caller has built and promoted it, so a failed build leaves no
# tag. A rerun keeps a tag already on the commit and fails on one that names another commit. A tag
# pushed with GITHUB_TOKEN starts no workflow, so the caller releases in the same run.
name: Tag release

on:
  workflow_call:
    inputs:
      version:
        description: release-commit.yml's version output.
        type: string
        required: true

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the commit
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          existing=$(git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" | tail -1 | cut -f1)
          if [ -n "$existing" ]; then
            [ "$existing" = "$GITHUB_SHA" ] || { echo "::error::$VERSION already tags $existing, not $GITHUB_SHA"; exit 1; }
            echo "$VERSION already tags $GITHUB_SHA"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$VERSION" -m "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
