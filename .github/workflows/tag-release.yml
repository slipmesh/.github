# Tags a merged release PR. A tag pushed with GITHUB_TOKEN starts no workflow, so the caller runs
# promote.yml and release.yml in the same run, gated on the `tag` output.
name: Tag release

on:
  workflow_call:
    outputs:
      tag:
        description: The tag created for a `chore: release vX` commit, or empty for any other commit.
        value: ${{ jobs.tag.outputs.tag }}

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # A squash merge through the web UI appends " (#N)" to the PR title.
      - name: Tag a release commit
        id: tag
        run: |
          subject=$(git log -1 --format=%s)
          re='^chore: release (v[0-9][^ ]*)( \(#[0-9]+\))?$'
          [[ $subject =~ $re ]] || exit 0
          tag=${BASH_REMATCH[1]}
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
