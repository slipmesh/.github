# Multi-arch image from binaries rust.yml built earlier in the same run.
#
# Each arch's image is built on that arch's own runner from `binaries-<arch>`, downloaded into
# `target/` so a Dockerfile copies `target/${TARGETARCH}/release/<name>`. Every run builds the
# image; a push to main or to a release-* branch also pushes each arch by digest and merges them
# into one manifest tagged `sha-<commit>` - Docker's build-by-digest-then-merge pattern. A release
# tag never rebuilds: release.yml retags that manifest.
name: Image

on:
  workflow_call:
    inputs:
      image:
        description: Image repository; defaults to ghcr.io/<owner>/<repo>.
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ${{ inputs.image || format('ghcr.io/{0}', github.repository) }}
  PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.arch }}
          path: target/

      - name: Restore the executable bit the artifact store drops
        run: chmod +x target/${{ matrix.arch }}/release/*

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image, and on main or a release branch push it by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}

      - name: Export digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the commit's multi-arch manifest
        working-directory: /tmp/digests
        run: |
          digests=(*)
          docker buildx imagetools create -t "$IMAGE:sha-$GITHUB_SHA" \
            "${digests[@]/#/$IMAGE@sha256:}"
