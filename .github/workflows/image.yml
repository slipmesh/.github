# The image of a release commit, from the run's rust-build.yml `binaries-<arch>` artifacts; a
# Dockerfile copies `target/${TARGETARCH}/release/<name>`. It is pushed as `sha-<commit>` for
# promote.yml to retag.
name: Image

on:
  workflow_call:
    inputs:
      image:
        description: Image repository; defaults to ghcr.io/<owner>/<repo>.
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ${{ inputs.image || format('ghcr.io/{0}', github.repository) }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.arch }}
          path: target/

      - name: Restore the executable bit the artifact store drops
        run: chmod +x target/${{ matrix.arch }}/release/*

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image and push it by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the commit's multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          digests=(*)
          docker buildx imagetools create -t "$IMAGE:sha-$GITHUB_SHA" \
            "${digests[@]/#/$IMAGE@sha256:}"
