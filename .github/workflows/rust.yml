# The checks every pull request and push runs. clippy and the tests run on each arch's own runner
# for the musl target that ships. musl-tools supplies the `musl-gcc` that crates with a C part
# (aws-lc-sys among them) build with. The release binaries come from rust-build.yml.
name: Rust

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  # Its own job, so an advisory hit is unambiguous in the checks list rather than buried in the
  # same log as an unrelated clippy or test failure.
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-audit

      - run: cargo audit

  # The caller's deny.toml is the policy: the licenses its own license can ship with, and the
  # registries and git sources it takes crates from. A repository without one fails here.
  licenses:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny

      - run: cargo deny --locked check licenses bans sources

  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_target }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.rust_target }}

      - name: clippy
        run: cargo clippy --locked --target ${{ matrix.rust_target }} --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --locked --target ${{ matrix.rust_target }}
