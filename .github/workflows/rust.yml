# The checks every pull request and push runs. clippy and the tests run on each arch's own runner
# for the musl target that ships. musl-tools supplies the `musl-gcc` that crates with a C part
# (aws-lc-sys among them) build with. The release binaries come from rust-build.yml.
name: Rust

on:
  workflow_call:

permissions:
  contents: read

# The tools a check runs are pinned so that a new release of one changes a pull request's result
# only through the Renovate pull request that moves it here.
env:
  # renovate: datasource=crate depName=cargo-audit
  CARGO_AUDIT_VERSION: 0.22.2
  # renovate: datasource=crate depName=cargo-deny
  CARGO_DENY_VERSION: 0.20.2
  # renovate: datasource=crate depName=cargo-about
  CARGO_ABOUT_VERSION: 0.9.3

jobs:
  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  # Its own job, so an advisory hit is unambiguous in the checks list rather than buried in the
  # same log as an unrelated clippy or test failure.
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - run: cargo audit

  # The caller's deny.toml is the policy: the licenses its own license can ship with, and the
  # registries and git sources it takes crates from. A repository without one fails here. One that
  # ships binaries renders its notices too, over the targets rust-build.yml renders them for, so a
  # license its about.toml does not accept fails the pull request rather than the release build.
  licenses:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      - run: cargo deny --locked check licenses bans sources

      - name: cargo about
        if: hashFiles('about.toml') != ''
        env:
          NOTICE_TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
        run: |
          read -ra targets <<<"$NOTICE_TARGETS"
          cargo about generate --locked --workspace --fail "${targets[@]/#/--target=}" -o /dev/null about.hbs

  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_target }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.rust_target }}

      - name: clippy
        run: cargo clippy --locked --target ${{ matrix.rust_target }} --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --locked --target ${{ matrix.rust_target }}
