# The checks every pull request and push runs. clippy and the tests run on each arch's own runner
# for the musl target that ships. musl-tools supplies the `musl-gcc` that crates with a C part
# (aws-lc-sys among them) build with. The release binaries come from rust-build.yml.
name: Rust

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  # Its own job, so an advisory hit is unambiguous in the checks list rather than buried in the
  # same log as an unrelated clippy or test failure.
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # cargo audit generates the Cargo.lock these repositories do not commit, with cargo.
      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit

      - run: cargo audit

  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - name: clippy
        run: cargo clippy --target ${{ matrix.rust_target }} --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --target ${{ matrix.rust_target }}
