# A release tag rebuilds nothing: it retags the `sha-<commit>` image that image.yml published, so
# what ships is what was tested.
name: Release

on:
  workflow_call:
    inputs:
      image:
        description: Image repository to promote; defaults to ghcr.io/<owner>/<repo>. Ignored when promote is false.
        type: string
        default: ""
      promote:
        description: Retag the tagged commit's `sha-<commit>` image as the release.
        type: boolean
        default: true
      latest-image:
        description: Also tag the promoted image `latest`. Leave off for anything released per Talos line.
        type: boolean
        default: false
      latest-release:
        description: Mark the GitHub Release as Latest. Turn off for releases cut from an older line.
        type: boolean
        default: true
      prepare:
        description: Shell run on the tag's checkout before the release is created, such as pinning a manifest to the release's image.
        type: string
        default: ""
      assets:
        description: Space-separated paths, relative to the checkout, attached to the GitHub Release.
        type: string
        default: ""

permissions:
  contents: read

env:
  IMAGE: ${{ inputs.image || format('ghcr.io/{0}', github.repository) }}

jobs:
  promote:
    if: inputs.promote
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag is usually pushed right after the release merge, while that commit's own run is
      # still building, so wait for its image rather than fail on the race. A commit that never
      # reached main or a release branch never gets one, and the wait ends in an error.
      - name: Retag the tagged commit's image as the release
        env:
          LATEST: ${{ inputs.latest-image }}
        run: |
          source="$IMAGE:sha-$GITHUB_SHA"
          for _ in $(seq 60); do
            docker buildx imagetools inspect "$source" >/dev/null 2>&1 && break
            sleep 30
          done
          docker buildx imagetools inspect "$source" >/dev/null || {
            echo "::error::$source does not exist - $GITHUB_REF_NAME must tag a commit that was built on main or a release-* branch"
            exit 1
          }
          tags=(-t "$IMAGE:${GITHUB_REF_NAME//+/-}")
          [ "$LATEST" = true ] && tags+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" "$source"

  github-release:
    needs: promote
    # Runs after promote, or without it when promote is off - but never after a failed promote.
    if: ${{ !cancelled() && (needs.promote.result == 'success' || needs.promote.result == 'skipped') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Prepare the release assets
        if: inputs.prepare != ''
        env:
          PREPARE: ${{ inputs.prepare }}
        run: bash -euo pipefail -c "$PREPARE"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS: ${{ inputs.assets }}
          LATEST: ${{ inputs.latest-release }}
        run: |
          read -ra assets <<<"$ASSETS"
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest="$LATEST"
