# GitHub Release for a tag tag-release.yml has pushed. Its assets are what the caller's run built:
# rust-build.yml's binaries (download-binaries) or files prepare stages; nothing is rebuilt here.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag. Exposed to prepare as $RELEASE_TAG.
        type: string
        required: true
      download-binaries:
        description: Download the run's rust-build.yml `binaries-<arch>` artifacts into `binaries/<arch>/release/` before prepare.
        type: boolean
        default: false
      prepare:
        description: Shell run on the tag's checkout before the release is created, such as pinning a manifest or staging binaries.
        type: string
        default: ""
      assets:
        description: Space-separated paths, relative to the checkout, attached to the GitHub Release.
        type: string
        default: ""
      latest:
        description: Mark the GitHub Release as Latest; release-commit.yml's latest output.
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub Release as a pre-release; release-commit.yml's prerelease output.
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  github-release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: git-cliff@2.14.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.download-binaries
        with:
          path: binaries/
          pattern: binaries-*
          merge-multiple: true

      - name: Prepare the release assets
        if: inputs.prepare != ''
        env:
          PREPARE: ${{ inputs.prepare }}
        run: bash -euo pipefail -c "$PREPARE"

      # The notes are the tag's CHANGELOG.md section: GitHub's generated notes would list the
      # release PR itself and its bot author as a new contributor. A rerun after a failed upload
      # finds the release already there and uploads its assets again.
      - name: Create the GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS: ${{ inputs.assets }}
          LATEST: ${{ inputs.latest }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          read -ra assets <<<"$ASSETS"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already released"
            [ ${#assets[@]} -eq 0 ] || gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            exit 0
          fi
          git cliff --current --strip all > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest="$LATEST" \
            --prerelease="$PRERELEASE"
